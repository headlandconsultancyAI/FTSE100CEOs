name: Monthly dashboard build

on:
  schedule:
    # 07:17 UTC on the 2nd of each month, a day after the Apify tasks run on the 1st
    - cron: "17 7 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Apify settings
        env:
          HAS_TOKEN: ${{ secrets.APIFY_TOKEN != '' }}
          TOKEN_IN_VARS: ${{ vars.APIFY_TOKEN != '' }}
          POSTS_TASK: ${{ secrets.APIFY_POSTS_TASK_ID || vars.APIFY_POSTS_TASK_ID }}
          FOLLOWERS_TASK: ${{ secrets.APIFY_FOLLOWERS_TASK_ID || vars.APIFY_FOLLOWERS_TASK_ID }}
        run: |
          ok=true
          if [ "$TOKEN_IN_VARS" = "true" ]; then
            echo "::error::APIFY_TOKEN is saved on the Variables tab. Delete it there and add it on the Secrets tab instead, because Variables are not kept private."
            ok=false
          elif [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::APIFY_TOKEN not found. Add it under Settings > Secrets and variables > Actions > Secrets tab > New repository secret. Environment secrets (e.g. github-pages) are not visible to this step."
            ok=false
          fi
          if [ -z "$POSTS_TASK" ]; then
            echo "::error::APIFY_POSTS_TASK_ID not found. Add it as a repository secret or variable, spelled exactly APIFY_POSTS_TASK_ID."
            ok=false
          fi
          if [ -z "$FOLLOWERS_TASK" ]; then
            echo "::warning::APIFY_FOLLOWERS_TASK_ID not set, so follower counts will not refresh this run."
          fi
          $ok && echo "Apify settings found."

      - name: Build dashboard from the latest Apify runs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_POSTS_TASK_ID: ${{ secrets.APIFY_POSTS_TASK_ID || vars.APIFY_POSTS_TASK_ID }}
          APIFY_FOLLOWERS_TASK_ID: ${{ secrets.APIFY_FOLLOWERS_TASK_ID || vars.APIFY_FOLLOWERS_TASK_ID }}
        run: python scripts/build.py

      - name: Save monthly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Monthly snapshot $(date -u +%Y-%m)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
