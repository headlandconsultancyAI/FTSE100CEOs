name: Monthly dashboard build

on:
  schedule:
    # 07:17 UTC on the 2nd of each month, a day after the Apify tasks run on the 1st
    - cron: "17 7 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard from the latest Apify runs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_POSTS_TASK_ID: ${{ secrets.APIFY_POSTS_TASK_ID }}
          APIFY_FOLLOWERS_TASK_ID: ${{ secrets.APIFY_FOLLOWERS_TASK_ID }}
        run: python scripts/build.py

      - name: Save monthly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Monthly snapshot $(date -u +%Y-%m)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
